<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 0,135 L 1200,135 M 0,270 L 1200,270 M 0,405 L 1200,405 M 0,540 L 1200,540" />
    <path d="M 240,0 L 240,675 M 480,0 L 480,675 M 720,0 L 720,675 M 960,0 L 960,675" />
  </g>

  <!-- Left: Prompt Box -->
  <g transform="translate(100, 180)">
    <rect width="360" height="315" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="2" filter="url(#glow2)"/>
    <rect width="360" height="45" rx="14" fill="#0F172A"/>
    <text x="20" y="28" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">NATURAL LANGUAGE PROMPT</text>

    <!-- Prompt Message Box -->
    <rect x="20" y="65" width="320" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="95" fill="#96c73d" font-family="monospace" font-size="12">"Create a purchase approval application</text>
    <text x="35" y="120" fill="#96c73d" font-family="monospace" font-size="12">where purchase requests above $50k</text>
    <text x="35" y="145" fill="#96c73d" font-family="monospace" font-size="12">require manager signoff, while specific</text>
    <text x="35" y="170" fill="#96c73d" font-family="monospace" font-size="12">plants follow custom approval rules."</text>
    <rect x="305" y="157" width="10" height="16" fill="#96c73d" filter="url(#glow2)"/>

    <!-- Prompt Status -->
    <rect x="20" y="235" width="320" height="50" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1"/>
    <text x="35" y="265" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">STATUS: PARSING BUSINESS INTENT...</text>
  </g>

  <!-- Center Arrow -->
  <path d="M 480,337 L 620,337" stroke="#A855F7" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow2)"/>

  <!-- Center NLP Engine Node -->
  <g transform="translate(560, 237)">
    <circle cx="100" cy="100" r="65" fill="#0F172A" stroke="url(#purpleGrad2)" stroke-width="4" filter="url(#glow2)"/>
    <text x="100" y="95" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">NLP ENGINE</text>
    <text x="100" y="115" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">&amp; REUSE MATRIX</text>
  </g>

  <path d="M 740,337 L 860,337" stroke="#96c73d" stroke-width="3" filter="url(#glow2)"/>

  <!-- Right: Generated Workflow & App -->
  <g transform="translate(780, 180)">
    <rect width="320" height="315" rx="14" fill="#1E293B" stroke="#96c73d" stroke-width="2" filter="url(#glow2)"/>
    <rect width="320" height="45" rx="14" fill="#0F172A"/>
    <text x="20" y="28" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">GENERATED WORKFLOW</text>

    <!-- Flow Diagram Cards -->
    <rect x="20" y="65" width="280" height="45" rx="6" fill="#0F172A" stroke="#38BDF8"/>
    <text x="35" y="92" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">1. Dynamic Web Form Created</text>

    <text x="160" y="125" fill="#94A3B8" font-size="14" font-weight="800" text-anchor="middle">↓</text>

    <rect x="20" y="135" width="280" height="45" rx="6" fill="#0F172A" stroke="#F59E0B"/>
    <text x="35" y="162" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">2. Reusable Rule: Threshold &gt; $50k</text>

    <text x="160" y="195" fill="#94A3B8" font-size="14" font-weight="800" text-anchor="middle">↓</text>

    <rect x="20" y="205" width="280" height="45" rx="6" fill="#0F172A" stroke="#96c73d"/>
    <text x="35" y="232" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">3. Manager Signoff &amp; ERP Action</text>
  </g>

  <!-- Left Stats HUD Card -->
  <g transform="translate(60, 60)">
    <rect width="250" height="90" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">INPUT METHOD</text>
    <text x="20" y="58" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">TEXT-TO-APP</text>
    <text x="20" y="78" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">NATURAL LANGUAGE PROMPTS</text>
  </g>

  <!-- Right Stats HUD Card -->
  <g transform="translate(890, 60)">
    <rect width="250" height="90" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">KNOWLEDGE BASE</text>
    <text x="20" y="58" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">RULE REUSE</text>
    <text x="20" y="78" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">ZERO DUPLICATED LOGIC</text>
  </g>
</svg>