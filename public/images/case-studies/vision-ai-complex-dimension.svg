<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#96c73d"/>
    </linearGradient>
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Technical Wireframe Background Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.3">
    <path d="M 0,100 H 1200 M 0,200 H 1200 M 0,300 H 1200 M 0,400 H 1200 M 0,500 H 1200 M 0,600 H 1200"/>
    <path d="M 150,0 V 675 M 300,0 V 675 M 450,0 V 675 M 600,0 V 675 M 750,0 V 675 M 900,0 V 675 M 1050,0 V 675"/>
  </g>

  <!-- Component Internal Cutaway Diagram -->
  <g transform="translate(600, 337)">
    <!-- Outer Metal Shell Cutaway (Flat Vector Graphics) -->
    <path d="M -300,-200 H 300 V -120 H -150 V 120 H 300 V 200 H -300 Z" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <path d="M -300,200 H 300 V 120 H -150 V -120 H 300 V -200 H -300 Z" fill="#0F172A" opacity="0.5"/>

    <!-- Internal Screw Thread Cavity (Zig-zag Thread Profile Vector) -->
    <path d="
      M -140,-120 
      L -120,-90 L -140,-60 L -120,-30 L -140,0 L -120,30 L -140,60 L -120,90 L -140,120
      H 180
      L 160,90 L 180,60 L 160,30 L 180,0 L 160,-30 L 180,-60 L 160,-90 L 180,-120
      Z
    " fill="#0F172A" stroke="#334155" stroke-width="3"/>

    <!-- 3D Point-Cloud Mesh / Inspection Nodes over Threads -->
    <g stroke="#96c73d" stroke-width="2" fill="none" filter="url(#meshGlow)">
      <!-- Left Threads Wireframe Mesh -->
      <path d="M -140,-120 L -120,-90 L -140,-60 L -120,-30 L -140,0 L -120,30 L -140,60 L -120,90 L -140,120"/>
      <circle cx="-140" cy="-120" r="4" fill="#96c73d"/>
      <circle cx="-120" cy="-90" r="4" fill="#96c73d"/>
      <circle cx="-140" cy="-60" r="4" fill="#96c73d"/>
      <circle cx="-120" cy="-30" r="4" fill="#96c73d"/>
      <circle cx="-140" cy="0" r="4" fill="#96c73d"/>
      <circle cx="-120" cy="30" r="4" fill="#96c73d"/>
      <circle cx="-140" cy="60" r="4" fill="#96c73d"/>
      <circle cx="-120" cy="90" r="4" fill="#96c73d"/>
      <circle cx="-140" cy="120" r="4" fill="#96c73d"/>

      <!-- Right Threads Wireframe Mesh -->
      <path d="M 180,-120 L 160,-90 L 180,-60 L 160,-30 L 180,0 L 160,30 L 180,60 L 160,90 L 180,120"/>
      <circle cx="180" cy="-120" r="4" fill="#38BDF8"/>
      <circle cx="160" cy="-90" r="4" fill="#38BDF8"/>
      <circle cx="180" cy="-60" r="4" fill="#38BDF8"/>
      <circle cx="160" cy="-30" r="4" fill="#38BDF8"/>
      <circle cx="180" cy="0" r="4" fill="#38BDF8"/>
      <circle cx="160" cy="30" r="4" fill="#38BDF8"/>
      <circle cx="180" cy="60" r="4" fill="#38BDF8"/>
      <circle cx="160" cy="90" r="4" fill="#38BDF8"/>
      <circle cx="180" cy="120" r="4" fill="#38BDF8"/>
    </g>

    <!-- Endoscopic Micro-Optics Probe Shaft -->
    <rect x="-400" y="-18" width="420" height="36" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="20" cy="0" r="22" fill="#06B6D4" filter="url(#meshGlow)"/>

    <!-- Optical Laser Scan Cone emitting from Probe Tip -->
    <polygon points="20,0 170,-100 170,100" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Dimension Metrics Overlay -->
    <path d="M -140,-140 H 180" stroke="#F59E0B" stroke-width="2"/>
    <text x="20" y="-150" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">THREAD PITCH: 1.75mm • DEPTH: 45.0mm</text>
  </g>

  <!-- Title / Metric HUD Boxes -->
  <rect x="60" y="60" width="280" height="100" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="80" y="90" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">INSPECTION TECHNOLOGY</text>
  <text x="80" y="116" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">ENDOSCOPIC OPTICS</text>
  <text x="80" y="140" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">3D POINT-CLOUD RECONSTRUCTION</text>

  <rect x="860" y="60" width="280" height="100" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="880" y="90" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">GEOMETRIC ACCURACY</text>
  <text x="880" y="116" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">100% INTERNAL THREAD</text>
  <text x="880" y="140" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">ZERO OCCLUSION / SHADOWS</text>
</svg>
