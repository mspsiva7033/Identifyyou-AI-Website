<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="orangeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad4)"/>

  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 0,135 L 1200,135 M 0,270 L 1200,270 M 0,405 L 1200,405 M 0,540 L 1200,540" />
    <path d="M 240,0 L 240,675 M 480,0 L 480,675 M 720,0 L 720,675 M 960,0 L 960,675" />
  </g>

  <!-- Center Core: Existing ERP & MES Systems -->
  <g transform="translate(480, 220)">
    <rect width="240" height="230" rx="16" fill="#0F172A" stroke="url(#orangeGrad4)" stroke-width="4" filter="url(#glow4)"/>
    <text x="120" y="60" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">CORE ENTERPRISE</text>
    <text x="120" y="85" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">ERP &amp; MES SYSTEMS</text>
    
    <rect x="30" y="110" width="180" height="35" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="120" y="132" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SAP / Oracle EBS Core</text>

    <rect x="30" y="155" width="180" height="35" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="120" y="177" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Shop Floor MES Engine</text>
  </g>

  <!-- Orbital Business Portals (Surrounding) -->
  <g transform="translate(100, 120)">
    <rect width="260" height="110" rx="10" fill="#1E293B" stroke="#96c73d" stroke-width="2" filter="url(#glow4)"/>
    <text x="20" y="35" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Production Portal</text>
    <text x="20" y="60" fill="#94A3B8" font-family="sans-serif" font-size="11">MES Shop Floor Tracking &amp; OEE</text>
    <path d="M 260,75 L 480,270" stroke="#96c73d" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(100, 440)">
    <rect width="260" height="110" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#glow4)"/>
    <text x="20" y="35" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Inventory Portal</text>
    <text x="20" y="60" fill="#94A3B8" font-family="sans-serif" font-size="11">Warehouse &amp; Stock Movements</text>
    <path d="M 260,485 L 480,380" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(840, 120)">
    <rect width="260" height="110" rx="10" fill="#1E293B" stroke="#A855F7" stroke-width="2" filter="url(#glow4)"/>
    <text x="20" y="35" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Supplier Portal</text>
    <text x="20" y="60" fill="#94A3B8" font-family="sans-serif" font-size="11">Vendor Quotes &amp; Orders Sync</text>
    <path d="M 840,175 L 720,270" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(840, 440)">
    <rect width="260" height="110" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#glow4)"/>
    <text x="20" y="35" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Quality Portal</text>
    <text x="20" y="60" fill="#94A3B8" font-family="sans-serif" font-size="11">Inspection Logs &amp; ERP Sync</text>
    <path d="M 840,485 L 720,380" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Left Stats HUD Card -->
  <g transform="translate(60, 60)">
    <rect width="250" height="90" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">ARCHITECTURE STRATEGY</text>
    <text x="20" y="58" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">SYSTEM EXTENSION</text>
    <text x="20" y="78" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">PRESERVE ERP INVESTMENTS</text>
  </g>

  <!-- Right Stats HUD Card -->
  <g transform="translate(890, 60)">
    <rect width="250" height="90" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">DIGITIZATION GOAL</text>
    <text x="20" y="58" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">100% DIGITIZED</text>
    <text x="20" y="78" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">ELIMINATE MANUAL SPREADSHEETS</text>
  </g>
</svg>