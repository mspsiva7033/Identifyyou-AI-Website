<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="laserGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Blueprint Radial Grid -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <circle cx="600" cy="337" r="100"/>
    <circle cx="600" cy="337" r="200"/>
    <circle cx="600" cy="337" r="300"/>
    <line x1="100" y1="337" x2="1100" y2="337"/>
    <line x1="600" y1="37" x2="600" y2="637"/>
    <line x1="246" y1="137" x2="954" y2="537"/>
    <line x1="246" y1="537" x2="954" y2="137"/>
  </g>

  <!-- Gear & Bore Component Visual (Technical Vector Shape) -->
  <g transform="translate(600, 337)">
    <!-- Outer Gear Sprocket Outline -->
    <circle cx="0" cy="0" r="210" fill="#1E293B" stroke="#64748B" stroke-width="6"/>

    <!-- Gear Teeth (Vector flat profile) -->
    <path d="
      M -20,-215 L 20,-215 L 25,-190 L -25,-190 Z
      M -20,215 L 20,215 L 25,190 L -25,190 Z
      M -215,-20 L -215,20 L -190,25 L -190,-25 Z
      M 215,-20 L 215,20 L 190,25 L 190,-25 Z
    " fill="#475569"/>

    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="180" fill="#0F172A" stroke="#475569" stroke-width="4"/>

    <!-- Inner Bore Hole -->
    <circle cx="0" cy="0" r="100" fill="#0284C7" fill-opacity="0.15" stroke="#06B6D4" stroke-width="4" stroke-dasharray="10 5" filter="url(#cyanGlow)"/>

    <!-- Keyway Notch Slot -->
    <rect x="-18" y="-120" width="36" height="40" fill="#06B6D4" fill-opacity="0.2" stroke="#38BDF8" stroke-width="3"/>

    <!-- Laser Profiler Scan Rays -->
    <line x1="0" y1="-260" x2="0" y2="0" stroke="#06B6D4" stroke-width="3" filter="url(#cyanGlow)"/>
    <line x1="-120" y1="-260" x2="-80" y2="0" stroke="#96c73d" stroke-width="2" opacity="0.7"/>
    <line x1="120" y1="-260" x2="80" y2="0" stroke="#96c73d" stroke-width="2" opacity="0.7"/>

    <!-- Sub-Micron Measurement Rings & Dimension Indicators -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#96c73d" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="6" fill="#96c73d" filter="url(#cyanGlow)"/>

    <!-- Caliper / Dimension Bracket -->
    <path d="M -100,-130 H 100" stroke="#96c73d" stroke-width="2"/>
    <path d="M -100,-125 V -135 M 100,-125 V -135" stroke="#96c73d" stroke-width="2"/>
    <text x="0" y="-140" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">BORE DIA: 50.002mm (±0.003mm)</text>

    <!-- Keyway Dimension -->
    <path d="M -25,-75 V -115 M 25,-75 V -115" stroke="#F59E0B" stroke-width="2"/>
    <text x="50" y="-90" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">KEYWAY: 10.001mm</text>
  </g>

  <!-- Top 3D Laser Metrology Unit -->
  <g transform="translate(600, 70)">
    <rect x="-110" y="-30" width="220" height="50" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="3"/>
    <text x="0" y="2" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">3D OPTICAL LASER METROLOGY</text>
    <circle cx="-85" cy="-5" r="5" fill="#96c73d" filter="url(#cyanGlow)"/>
  </g>

  <!-- Left Stats HUD Card -->
  <rect x="60" y="60" width="250" height="110" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="80" y="92" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">METROLOGY PRECISION</text>
  <text x="80" y="120" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">&lt; 3 MICRON</text>
  <text x="80" y="145" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">REPEATABILITY ASSURED</text>

  <!-- Right Stats HUD Card -->
  <rect x="890" y="60" width="250" height="110" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="910" y="92" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">PRODUCTION CYCLE</text>
  <text x="910" y="120" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">9 SECONDS</text>
  <text x="910" y="145" fill="#96c73d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">SYNCHRONIZED INLINE</text>
</svg>
